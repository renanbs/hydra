<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="space-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#052c20" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#02110c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>

    <!-- Emerald Shading Palette -->
    <!-- Dark Shadow tone -->
    <linearGradient id="g-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2b22"/>
      <stop offset="100%" stop-color="#03120d"/>
    </linearGradient>

    <!-- Mid tone (Rich Emerald) -->
    <linearGradient id="g-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Light tone (Vibrant Neon Mint / Cyan) -->
    <linearGradient id="g-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="g-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="hyper-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="eye-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- PURE BLACK BACKGROUND -->
  <rect width="1024" height="1024" fill="#000000"/>
  <rect width="1024" height="1024" fill="url(#space-bg)"/>

  <!-- Dramatic Ambient Aura behind Hydra -->
  <circle cx="512" cy="450" r="320" fill="#00f5d4" opacity="0.09" filter="url(#hyper-glow)"/>

  <!-- ==================== BODY & BASE TORSO ==================== -->
  <g id="hydra-body">
    <!-- Lower Muscular Body where all 3 necks merge -->
    <path d="M 400 920 C 370 820 420 730 450 670 L 574 670 C 604 730 654 820 624 920 C 564 960 460 960 400 920 Z"
          fill="url(#g-shadow)" stroke="#059669" stroke-width="2"/>

    <!-- Central Ventral Chest Armor (Muscular V-plates) -->
    <polygon points="512,680 560,740 512,770 464,740" fill="url(#g-mid)" stroke="#34d399" stroke-width="1.5"/>
    <polygon points="512,770 566,830 512,860 458,830" fill="url(#g-mid)" stroke="#34d399" stroke-width="1.5"/>
    <polygon points="512,860 560,910 512,940 464,910" fill="url(#g-mid)" stroke="#34d399" stroke-width="1.5"/>

    <!-- Glowing Core Diamond in chest -->
    <polygon points="512,700 535,735 512,760 489,735" fill="url(#g-cyan)" filter="url(#soft-glow)"/>
    <circle cx="512" cy="735" r="4" fill="#ffffff"/>
  </g>

  <!-- ==================== 1. LEFT DRAGON (HEAD & NECK) ==================== -->
  <g id="left-dragon-head">
    <!-- Left Neck Muscular Solid Arch -->
    <path d="M 450 690 C 330 670 170 580 160 420 C 150 260 270 180 370 200 L 360 270 C 290 260 230 310 235 420 C 240 530 330 600 440 620 Z"
          fill="url(#g-shadow)" stroke="#059669" stroke-width="2"/>

    <!-- Left Neck Highlight Contour (Light shining along top curve of neck) -->
    <path d="M 450 690 C 330 670 170 580 160 420 C 150 260 270 180 370 200"
          fill="none" stroke="url(#g-light)" stroke-width="4" stroke-linecap="round" filter="url(#soft-glow)"/>

    <!-- Left Neck Inner Muscular Highlight -->
    <path d="M 235 420 C 240 530 330 600 440 620 L 440 640 C 315 620 220 545 215 420 Z"
          fill="url(#g-mid)"/>

    <!-- Dorsal Spines along Left Neck -->
    <g fill="url(#g-cyan)" filter="url(#soft-glow)">
      <polygon points="160,420 85,400 155,455"/>
      <polygon points="165,330 95,290 160,365"/>
      <polygon points="195,250 135,190 195,275"/>
      <polygon points="255,195 215,130 260,215"/>
    </g>

    <!-- LEFT DRAGON HEAD (Large, fierce, facing inward/forward with open roaring maws) -->
    <!-- Lower Jaw Dropped Open -->
    <path d="M 330 280 L 380 365 L 450 380 L 430 325 L 365 270 Z"
          fill="url(#g-shadow)" stroke="#10b981" stroke-width="2"/>
    <path d="M 380 365 L 450 380 L 430 325 Z" fill="url(#g-mid)"/>
    <!-- Lower Sharp Fangs -->
    <polygon points="415,355 435,315 442,358" fill="#ffffff" filter="url(#soft-glow)"/>
    <polygon points="385,340 398,310 405,345" fill="#ffffff"/>

    <!-- Tongue / Energy flickering from mouth -->
    <path d="M 365 300 Q 420 320 480 305 L 505 290 M 480 305 L 505 320"
          fill="none" stroke="#00f5d4" stroke-width="3" stroke-linecap="round" filter="url(#soft-glow)"/>

    <!-- Dragon Cranium / Upper Skull -->
    <path d="M 300 215 C 310 160 360 145 420 170 C 470 195 500 230 515 255 C 475 275 425 275 360 260 Z"
          fill="url(#g-mid)" stroke="#34d399" stroke-width="2"/>
    <path d="M 300 215 C 330 180 380 165 420 170 L 380 230 Z" fill="url(#g-light)"/>

    <!-- Magnificent Swept-Back Dragon Horns -->
    <polygon points="320,195 190,120 285,170" fill="url(#g-light)" filter="url(#soft-glow)"/>
    <polygon points="350,180 230,85 320,145" fill="url(#g-cyan)" filter="url(#soft-glow)"/>
    <polygon points="390,175 290,60 360,135" fill="#ffffff"/>

    <!-- Upper Snout & Lethal Dragon Fangs -->
    <path d="M 450 235 C 490 250 515 255 510 265 C 475 285 430 280 380 265 Z"
          fill="url(#g-shadow)" stroke="#10b981" stroke-width="1.8"/>
    <circle cx="488" cy="250" r="3.5" fill="#00f5d4"/> <!-- Nostril -->

    <!-- Primary Long Venomous Fangs -->
    <polygon points="480,265 496,268 485,315" fill="#ffffff" filter="url(#soft-glow)"/>
    <polygon points="445,268 458,270 450,305" fill="#ffffff"/>

    <!-- Glowing Piercing Eye -->
    <polygon points="380,200 420,215 405,230 368,220" fill="#00f5d4" filter="url(#eye-glow)"/>
    <polygon points="384,204 414,215 402,226 374,220" fill="#ffffff"/>
    <line x1="395" y1="205" x2="390" y2="226" stroke="#000000" stroke-width="3"/>
  </g>

  <!-- ==================== 2. RIGHT DRAGON (HEAD & NECK) ==================== -->
  <g id="right-dragon-head">
    <!-- Right Neck Muscular Solid Arch -->
    <path d="M 574 690 C 694 670 854 580 864 420 C 874 260 754 180 654 200 L 664 270 C 734 260 794 310 789 420 C 784 530 694 600 584 620 Z"
          fill="url(#g-shadow)" stroke="#059669" stroke-width="2"/>

    <!-- Right Neck Highlight Contour -->
    <path d="M 574 690 C 694 670 854 580 864 420 C 874 260 754 180 654 200"
          fill="none" stroke="url(#g-light)" stroke-width="4" stroke-linecap="round" filter="url(#soft-glow)"/>

    <!-- Right Neck Inner Muscular Highlight -->
    <path d="M 789 420 C 784 530 694 600 584 620 L 584 640 C 709 620 804 545 809 420 Z"
          fill="url(#g-mid)"/>

    <!-- Dorsal Spines along Right Neck -->
    <g fill="url(#g-cyan)" filter="url(#soft-glow)">
      <polygon points="864,420 939,400 869,455"/>
      <polygon points="859,330 929,290 864,365"/>
      <polygon points="829,250 889,190 829,275"/>
      <polygon points="769,195 809,130 764,215"/>
    </g>

    <!-- RIGHT DRAGON HEAD (Facing inward/forward with open roaring maws) -->
    <!-- Lower Jaw Dropped Open -->
    <path d="M 694 280 L 644 365 L 574 380 L 594 325 L 659 270 Z"
          fill="url(#g-shadow)" stroke="#10b981" stroke-width="2"/>
    <path d="M 644 365 L 574 380 L 594 325 Z" fill="url(#g-mid)"/>
    <!-- Lower Sharp Fangs -->
    <polygon points="609,355 589,315 582,358" fill="#ffffff" filter="url(#soft-glow)"/>
    <polygon points="639,340 626,310 619,345" fill="#ffffff"/>

    <!-- Tongue / Energy flickering from mouth -->
    <path d="M 659 300 Q 604 320 544 305 L 519 290 M 544 305 L 519 320"
          fill="none" stroke="#00f5d4" stroke-width="3" stroke-linecap="round" filter="url(#soft-glow)"/>

    <!-- Dragon Cranium / Upper Skull -->
    <path d="M 724 215 C 714 160 664 145 604 170 C 554 195 524 230 509 255 C 549 275 599 275 664 260 Z"
          fill="url(#g-mid)" stroke="#34d399" stroke-width="2"/>
    <path d="M 724 215 C 694 180 644 165 604 170 L 644 230 Z" fill="url(#g-light)"/>

    <!-- Backward Dragon Horns -->
    <polygon points="704,195 834,120 739,170" fill="url(#g-light)" filter="url(#soft-glow)"/>
    <polygon points="674,180 794,85 704,145" fill="url(#g-cyan)" filter="url(#soft-glow)"/>
    <polygon points="634,175 734,60 664,135" fill="#ffffff"/>

    <!-- Upper Snout & Lethal Dragon Fangs -->
    <path d="M 574 235 C 534 250 509 255 514 265 C 549 285 594 280 644 265 Z"
          fill="url(#g-shadow)" stroke="#10b981" stroke-width="1.8"/>
    <circle cx="536" cy="250" r="3.5" fill="#00f5d4"/>

    <!-- Primary Long Venomous Fangs -->
    <polygon points="544,265 528,268 539,315" fill="#ffffff" filter="url(#soft-glow)"/>
    <polygon points="579,268 566,270 574,305" fill="#ffffff"/>

    <!-- Glowing Piercing Eye -->
    <polygon points="644,200 604,215 619,230 656,220" fill="#00f5d4" filter="url(#eye-glow)"/>
    <polygon points="640,204 610,215 622,226 650,220" fill="#ffffff"/>
    <line x1="629" y1="205" x2="634" y2="226" stroke="#000000" stroke-width="3"/>
  </g>

  <!-- ==================== 3. CENTER APEX DRAGON (ROARING UPWARD) ==================== -->
  <g id="center-dragon-head">
    <!-- Center Muscular Neck Column -->
    <path d="M 465 680 C 460 550 475 420 480 320 L 544 320 C 549 420 564 550 559 680 Z"
          fill="url(#g-shadow)" stroke="#059669" stroke-width="2"/>

    <!-- Center Ventral Muscular Bands (Subtle, organic) -->
    <path d="M 475 580 C 500 595 524 595 549 580 L 553 610 C 524 625 500 625 471 610 Z" fill="url(#g-mid)"/>
    <path d="M 477 510 C 500 525 524 525 547 510 L 551 540 C 524 555 500 555 473 540 Z" fill="url(#g-mid)"/>
    <path d="M 479 440 C 500 455 524 455 545 440 L 549 470 C 524 485 500 485 475 470 Z" fill="url(#g-mid)"/>
    <path d="M 480 370 C 500 385 524 385 544 370 L 547 400 C 524 415 500 415 477 400 Z" fill="url(#g-mid)"/>

    <!-- Great Center Dragon Head (Dominant, Frontal, Majestic Horns) -->
    <!-- Crown Great Horns (Reaching high into the night) -->
    <!-- Main Center Spear Horn -->
    <polygon points="512,30 475,140 512,115 549,140" fill="#ffffff" filter="url(#hyper-glow)"/>
    <!-- Large Swept Left Horn -->
    <polygon points="512,70 400,95 465,160" fill="url(#g-light)" filter="url(#soft-glow)"/>
    <polygon points="512,70 340,130 425,185" fill="url(#g-mid)"/>
    <!-- Large Swept Right Horn -->
    <polygon points="512,70 624,95 559,160" fill="url(#g-light)" filter="url(#soft-glow)"/>
    <polygon points="512,70 684,130 599,185" fill="url(#g-mid)"/>

    <!-- Cranium & Dragon Brow -->
    <polygon points="512,145 420,195 512,225 604,195" fill="url(#g-mid)" stroke="#34d399" stroke-width="2"/>
    <polygon points="512,145 420,195 460,235 512,225" fill="url(#g-shadow)"/>
    <polygon points="512,145 604,195 564,235 512,225" fill="url(#g-light)"/>

    <!-- Glowing Frontal Eyes -->
    <polygon points="445,200 480,212 470,226 438,218" fill="#00f5d4" filter="url(#eye-glow)"/>
    <polygon points="448,202 476,212 468,224 442,218" fill="#ffffff"/>
    <line x1="458" y1="203" x2="454" y2="224" stroke="#000000" stroke-width="3"/>

    <polygon points="579,200 544,212 554,226 586,218" fill="#00f5d4" filter="url(#eye-glow)"/>
    <polygon points="576,202 548,212 556,224 582,218" fill="#ffffff"/>
    <line x1="566" y1="203" x2="570" y2="224" stroke="#000000" stroke-width="3"/>

    <!-- Snout & Frontal Roaring Maw -->
    <polygon points="512,225 465,280 512,305 559,280" fill="url(#g-shadow)" stroke="#10b981" stroke-width="2"/>
    <circle cx="485" cy="285" r="3.5" fill="#00f5d4"/>
    <circle cx="539" cy="285" r="3.5" fill="#00f5d4"/>

    <!-- Deep Roaring Mouth Cavity -->
    <path d="M 460 290 Q 512 325 564 290 Q 512 355 460 290 Z" fill="#010c08" stroke="#10b981" stroke-width="1.8"/>

    <!-- Energy Plasma in Mouth -->
    <circle cx="512" cy="320" r="16" fill="#00f5d4" opacity="0.7" filter="url(#hyper-glow)"/>
    <circle cx="512" cy="320" r="8" fill="#ffffff"/>

    <!-- Frontal Lethal Fangs -->
    <polygon points="472,292 488,296 478,335" fill="#ffffff" filter="url(#hyper-glow)"/>
    <polygon points="552,292 536,296 546,335" fill="#ffffff" filter="url(#hyper-glow)"/>
    <polygon points="496,298 506,300 501,320" fill="#ffffff"/>
    <polygon points="528,298 518,300 523,320" fill="#ffffff"/>

    <!-- Lower Jaw / Dragon Beard Horn -->
    <polygon points="478,335 512,370 546,335 512,345" fill="url(#g-mid)" stroke="#34d399" stroke-width="2"/>
    <polygon points="512,370 495,395 512,415 529,395" fill="url(#g-light)" filter="url(#soft-glow)"/>
  </g>
</svg>
