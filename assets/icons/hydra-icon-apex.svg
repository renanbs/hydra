<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#071a14" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#020705" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>

    <!-- Emerald-Cyan Hyper Gradient (Light/Glow) -->
    <linearGradient id="neon-cyan-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Electric Cyan Highlight -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Facet Dark / Obsidian Shading -->
    <linearGradient id="facet-dark-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2922"/>
      <stop offset="50%" stop-color="#071915"/>
      <stop offset="100%" stop-color="#030c0a"/>
    </linearGradient>

    <linearGradient id="facet-dark-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16382f"/>
      <stop offset="50%" stop-color="#0b241e"/>
      <stop offset="100%" stop-color="#04100d"/>
    </linearGradient>

    <linearGradient id="facet-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Chrome Rim Light -->
    <linearGradient id="rim-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a7f3d0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ambient-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
    </filter>
  </defs>

  <!-- Deep Black Canvas -->
  <rect width="512" height="512" fill="#000000"/>
  <rect width="512" height="512" fill="url(#bg-glow)"/>

  <!-- App Icon Squircle Border (Subtle obsidian bezel) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.18"/>
  <rect x="18" y="18" width="476" height="476" rx="106" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.06"/>

  <!-- Center Ambient Core Glow -->
  <circle cx="256" cy="256" r="110" fill="#00f5d4" opacity="0.12" filter="url(#ambient-glow)"/>
  <circle cx="256" cy="180" r="70" fill="#10b981" opacity="0.15" filter="url(#ambient-glow)"/>

  <!-- ==================== BACK TENTACLES / ENERGY CONDUITS ==================== -->
  <g opacity="0.4" filter="url(#soft-glow)">
    <!-- Left Conduits -->
    <path d="M 256 340 C 200 330 110 270 120 180" fill="none" stroke="#00f5d4" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 8"/>
    <!-- Right Conduits -->
    <path d="M 256 340 C 312 330 402 270 392 180" fill="none" stroke="#00f5d4" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 8"/>
  </g>

  <!-- ==================== LEFT HYDRA HEAD & NECK ==================== -->
  <!-- Left Outer Neck Curve -->
  <g id="left-head-group">
    <!-- Left Neck Background Plate -->
    <path d="M 230 350 C 180 340 100 280 110 200 C 114 165 130 140 152 135 C 160 133 172 142 170 155 C 166 178 152 196 148 215 C 142 245 178 290 220 315 Z"
          fill="url(#facet-dark-left)" stroke="#059669" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Left Neck Segment 1 -->
    <path d="M 125 240 C 130 265 155 300 215 330 L 225 310 C 175 285 145 250 140 230 Z"
          fill="url(#facet-dark-right)" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.3"/>

    <!-- Left Neck Segment 2 -->
    <path d="M 115 210 C 118 230 130 255 150 275 L 160 260 C 142 242 132 222 130 205 Z"
          fill="url(#facet-dark-left)" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.4"/>

    <!-- Left Head Crown/Jaw -->
    <!-- Lower Jaw -->
    <polygon points="122,175 145,195 168,180 140,168" fill="#062e24" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Upper Skull / Facets -->
    <polygon points="135,135 170,145 155,175 125,160" fill="url(#facet-mid)" stroke="#34d399" stroke-width="1.2"/>
    <polygon points="135,135 155,175 120,165 105,145" fill="url(#facet-dark-left)" stroke="#059669" stroke-width="1"/>

    <!-- Left Crest Horn -->
    <polygon points="135,135 100,120 125,145" fill="url(#neon-cyan-emerald)"/>
    <polygon points="135,135 120,110 142,130" fill="#a7f3d0"/>

    <!-- Left Eye / Neural Optic (Glowing Cyan Gem) -->
    <polygon points="134,156 146,160 140,166 128,162" fill="#00f5d4" filter="url(#soft-glow)"/>
    <polygon points="134,156 146,160 140,166 128,162" fill="#ffffff"/>

    <!-- Left Luminous Ridge -->
    <path d="M 100 120 L 135 135 L 170 145 C 160 185 140 220 135 250 C 130 280 170 320 220 345"
          fill="none" stroke="url(#neon-cyan-emerald)" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- ==================== RIGHT HYDRA HEAD & NECK ==================== -->
  <g id="right-head-group">
    <!-- Right Neck Background Plate -->
    <path d="M 282 350 C 332 340 412 280 402 200 C 398 165 382 140 360 135 C 352 133 340 142 342 155 C 346 178 360 196 364 215 C 370 245 334 290 292 315 Z"
          fill="url(#facet-dark-right)" stroke="#059669" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Right Neck Segment 1 -->
    <path d="M 387 240 C 382 265 357 300 297 330 L 287 310 C 337 285 367 250 372 230 Z"
          fill="url(#facet-dark-left)" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.3"/>

    <!-- Right Neck Segment 2 -->
    <path d="M 397 210 C 394 230 382 255 362 275 L 352 260 C 370 242 380 222 382 205 Z"
          fill="url(#facet-dark-right)" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.4"/>

    <!-- Right Head Crown/Jaw -->
    <!-- Lower Jaw -->
    <polygon points="390,175 367,195 344,180 372,168" fill="#062e24" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Upper Skull / Facets -->
    <polygon points="377,135 342,145 357,175 387,160" fill="url(#facet-mid)" stroke="#34d399" stroke-width="1.2"/>
    <polygon points="377,135 357,175 392,165 407,145" fill="url(#facet-dark-right)" stroke="#059669" stroke-width="1"/>

    <!-- Right Crest Horn -->
    <polygon points="377,135 412,120 387,145" fill="url(#neon-cyan-emerald)"/>
    <polygon points="377,135 392,110 370,130" fill="#a7f3d0"/>

    <!-- Right Eye / Neural Optic (Glowing Cyan Gem) -->
    <polygon points="378,156 366,160 372,166 384,162" fill="#00f5d4" filter="url(#soft-glow)"/>
    <polygon points="378,156 366,160 372,166 384,162" fill="#ffffff"/>

    <!-- Right Luminous Ridge -->
    <path d="M 412 120 L 377 135 L 342 145 C 352 185 372 220 377 250 C 382 280 342 320 292 345"
          fill="none" stroke="url(#neon-cyan-emerald)" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- ==================== CENTRAL HYDRA HEAD (APEX PRIME) ==================== -->
  <g id="center-head-group">
    <!-- Center Spine Dorsal Crest Plates (Descending from neck to body) -->
    <!-- Plate 4 (Lowest) -->
    <polygon points="256,295 285,320 256,335 227,320" fill="url(#facet-dark-right)" stroke="#10b981" stroke-width="1.2"/>
    <polygon points="256,295 256,335 227,320" fill="url(#facet-dark-left)"/>

    <!-- Plate 3 -->
    <polygon points="256,260 290,288 256,305 222,288" fill="url(#facet-dark-right)" stroke="#10b981" stroke-width="1.2"/>
    <polygon points="256,260 256,305 222,288" fill="url(#facet-dark-left)"/>

    <!-- Plate 2 -->
    <polygon points="256,225 295,252 256,270 217,252" fill="url(#facet-dark-right)" stroke="#34d399" stroke-width="1.4"/>
    <polygon points="256,225 256,270 217,252" fill="url(#facet-dark-left)"/>

    <!-- Plate 1 (Under chin) -->
    <polygon points="256,190 288,218 256,234 224,218" fill="url(#facet-mid)" stroke="#34d399" stroke-width="1.4"/>
    <polygon points="256,190 256,234 224,218" fill="url(#facet-dark-left)"/>

    <!-- Main Central Crown / Horns -->
    <!-- Left Crown Horn -->
    <polygon points="256,72 232,105 248,125 256,108" fill="url(#neon-cyan-emerald)"/>
    <polygon points="256,72 215,90 236,118" fill="#059669" stroke="#34d399" stroke-width="0.8"/>

    <!-- Right Crown Horn -->
    <polygon points="256,72 280,105 264,125 256,108" fill="url(#cyan-glow)"/>
    <polygon points="256,72 297,90 276,118" fill="#10b981" stroke="#6ee7b7" stroke-width="0.8"/>

    <!-- Central Skull Facets -->
    <!-- Forehead Left -->
    <polygon points="256,108 220,135 240,165 256,155" fill="url(#facet-dark-left)" stroke="#10b981" stroke-width="1.2"/>
    <!-- Forehead Right -->
    <polygon points="256,108 292,135 272,165 256,155" fill="url(#facet-mid)" stroke="#34d399" stroke-width="1.2"/>

    <!-- Temporal Cheeks Left -->
    <polygon points="220,135 195,152 225,178 240,165" fill="#072019" stroke="#059669" stroke-width="1"/>
    <!-- Temporal Cheeks Right -->
    <polygon points="292,135 317,152 287,178 272,165" fill="#134e4a" stroke="#10b981" stroke-width="1"/>

    <!-- Snout Bridge (Center Nose Ridge) -->
    <polygon points="256,155 242,185 256,202" fill="url(#facet-dark-left)" stroke="#059669" stroke-width="1"/>
    <polygon points="256,155 270,185 256,202" fill="url(#facet-mid)" stroke="#34d399" stroke-width="1"/>

    <!-- Mandible / Lower Jaw Tip -->
    <polygon points="256,202 245,214 256,224 267,214" fill="#00f5d4" opacity="0.9"/>

    <!-- Center Eyes (Dual Cybernetic Optics) -->
    <!-- Left Eye -->
    <polygon points="238,154 250,158 244,166 234,162" fill="#00f5d4" filter="url(#soft-glow)"/>
    <polygon points="238,154 250,158 244,166 234,162" fill="#ffffff"/>

    <!-- Right Eye -->
    <polygon points="274,154 262,158 268,166 278,162" fill="#00f5d4" filter="url(#soft-glow)"/>
    <polygon points="274,154 262,158 268,166 278,162" fill="#ffffff"/>

    <!-- Apex Core Crystal (Third Eye / Autonomous Agent Core) -->
    <polygon points="256,122 264,136 256,148 248,136" fill="#38bdf8" filter="url(#soft-glow)"/>
    <polygon points="256,125 262,136 256,145 250,136" fill="#ffffff"/>
  </g>

  <!-- ==================== CENTRAL NEXUS / ENGINE BODY ==================== -->
  <!-- Converging Chest Chevron & Power Conduits -->
  <g id="nexus-engine">
    <!-- Outer Armored Pectorals -->
    <polygon points="256,335 320,355 295,395 256,375" fill="url(#facet-mid)" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="256,335 192,355 217,395 256,375" fill="url(#facet-dark-left)" stroke="#059669" stroke-width="1.5"/>

    <!-- Mid Torso Chevron -->
    <polygon points="256,375 295,395 275,430 256,415" fill="url(#facet-dark-right)" stroke="#34d399" stroke-width="1.4"/>
    <polygon points="256,375 217,395 237,430 256,415" fill="url(#facet-dark-left)" stroke="#10b981" stroke-width="1.4"/>

    <!-- Apex Spine Tail (Base Anchor) -->
    <polygon points="256,415 275,430 256,455 237,430" fill="url(#neon-cyan-emerald)" stroke="#6ee7b7" stroke-width="1.2"/>
    <polygon points="256,432 266,442 256,454 246,442" fill="#ffffff" filter="url(#soft-glow)"/>

    <!-- Central Glowing Power Conduit / Bus -->
    <line x1="256" y1="125" x2="256" y2="450" stroke="#00f5d4" stroke-width="2.5" stroke-linecap="round" filter="url(#soft-glow)"/>
    <line x1="256" y1="125" x2="256" y2="450" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>

    <!-- Energy Nodes along the Spine -->
    <circle cx="256" cy="270" r="3.5" fill="#ffffff" filter="url(#soft-glow)"/>
    <circle cx="256" cy="305" r="3.5" fill="#ffffff" filter="url(#soft-glow)"/>
    <circle cx="256" cy="335" r="4.5" fill="#00f5d4" filter="url(#soft-glow)"/>
    <circle cx="256" cy="375" r="4" fill="#00f5d4" filter="url(#soft-glow)"/>
    <circle cx="256" cy="415" r="3" fill="#ffffff" filter="url(#soft-glow)"/>
  </g>

  <!-- Corner Tech Accents (Subtle ADE HUD Markings) -->
  <g opacity="0.35" stroke="#10b981" stroke-width="1">
    <!-- Top Left -->
    <path d="M 45 65 L 45 45 L 65 45"/>
    <circle cx="45" cy="45" r="2" fill="#10b981"/>
    <!-- Top Right -->
    <path d="M 467 65 L 467 45 L 447 45"/>
    <circle cx="467" cy="45" r="2" fill="#10b981"/>
    <!-- Bottom Left -->
    <path d="M 45 447 L 45 467 L 65 467"/>
    <circle cx="45" cy="467" r="2" fill="#10b981"/>
    <!-- Bottom Right -->
    <path d="M 467 447 L 467 467 L 447 467"/>
    <circle cx="467" cy="467" r="2" fill="#10b981"/>
  </g>
</svg>
