<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rosetta spike — Orca sidebar</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #17181b; color: #e5e7eb; }
      #root { display: flex; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Diagnostic: report boot failures even if the module graph fails.
      fetch('/__rosetta-report', { method: 'POST', body: 'CHILD boot' }).catch(() => {})
      window.addEventListener('error', (event) => {
        fetch('/__rosetta-report', {
          method: 'POST',
          body: `CHILD error ${event.message} @ ${event.filename}:${event.lineno}`
        }).catch(() => {})
      })
      window.addEventListener('unhandledrejection', (event) => {
        fetch('/__rosetta-report', {
          method: 'POST',
          body: `CHILD rejection ${String(event.reason)}`
        }).catch(() => {})
      })
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
